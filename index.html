<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shubham ❤️ Priya</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      color: #fff;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: -2;
    }

    .stars {
      position: fixed;
      width: 100%; height: 100%;
      background: transparent url("https://www.transparenttextures.com/patterns/stardust.png") repeat;
      animation: twinkle 60s linear infinite;
      z-index: -1;
    }

    @keyframes twinkle {
      from { background-position: 0 0; }
      to { background-position: -10000px 5000px; }
    }

    .banner {
      background: rgba(255, 245, 247, 0.2);
      color: #ffcccc;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Georgia', serif;
      padding: 6px 10px;
      border-top: 2px solid #ffb6c1;
      border-bottom: 2px solid #ffb6c1;
    }

    h1 {
      margin-top: 10px;
      font-size: 1.6rem;
      color: #ff4d6d;
      white-space: nowrap;
    }

    #countdown {
      font-size: 1.2rem;
      margin: 5px 0 10px 0;
      font-weight: bold;
    }

    .slideshow-container {
      width: 90%;
      max-width: 400px;
      margin: 10px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }

    .mySlides {
      display: none;
    }

    .mySlides img {
      width: 100%;
      max-height: 50vh;
      object-fit: cover;
      border-radius: 12px;
    }

    .surprise-btn {
      background: #ff4d6d;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 0 10px rgba(255,77,109,0.7);
      transition: 0.3s;
    }
    .surprise-btn:hover {
      background: #ff3355;
      box-shadow: 0 0 18px rgba(255,77,109,1);
    }

    .hidden-message {
      display: none;
      margin-top: 10px;
      font-size: 1.1rem;
      color: #ffcccc;
      font-family: 'Dancing Script', cursive;
      white-space: pre-line;
      max-width: 80%;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .show {
      display: block;
      opacity: 1;
    }

    /* ❤️ Rising hearts */
    .touch-heart {
      position: absolute;
      font-size: 14px;
      color: red;
      animation: rise 1.5s linear forwards;
      pointer-events: none;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
    }

    /* --------------------------------------------------------- */
    /* 🌟 NEW OVERLAY ANIMATION – WEDDING DAY 💖 */
    /* --------------------------------------------------------- */
    #weddingOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      animation: fadeIn 2s ease forwards;
    }

    .big-text {
      font-size: 2rem;
      color: #ffb6c1;
      font-family: 'Georgia';
      text-shadow: 0 0 20px #ff4d6d;
      opacity: 0;
      animation: textAppear 3s ease forwards;
    }

    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    @keyframes textAppear { from {opacity:0;} to {opacity:1;} }

    /* Floating hearts for overlay */
    .heart {
      position: absolute;
      color: pink;
      font-size: 18px;
      animation: floatUp 4s ease-in infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(50px); opacity: 0.2; }
      100% { transform: translateY(-500px); opacity: 0; }
    }

    /* --------------------------------------------------------- */
    /* 💌 LOVE LETTER POPUP */
    /* --------------------------------------------------------- */
    #loveLetter {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 450px;
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 15px;
      color: #333;
      font-family: 'Georgia';
      z-index: 10000;
      box-shadow: 0 0 20px rgba(255,77,109,0.7);
    }

    #storyStartBtn {
      margin-top: 15px;
      background: #ff4d6d;
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 20px;
      cursor: pointer;
    }

    /* --------------------------------------------------------- */
    /* 📖 STORY SLIDESHOW (overlay mode) */
    /* --------------------------------------------------------- */
    #storyOverlay {
      display: none;
      position: fixed;
      top:0; left:0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 10001;
      color: white;
      padding: 30px 15px;
      text-align: center;
      font-family: 'Georgia';
    }

    #storyImg {
      width: 80%;
      max-width: 350px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255,77,109,0.7);
    }

    #storyCaption {
      margin-top: 15px;
      font-size: 1.1rem;
      line-height: 1.4;
    }
    
  </style>
</head>
<body>

<div class="stars"></div>

<div class="banner">💍 Save the Date — 29th November 2025 💌</div>

<h1>❤️ Shubham & Priya ❤️ </h1>
<div id="countdown">Loading...</div>

<!-- Existing slideshow -->
<div class="slideshow-container">
  <div class="mySlides fade"><img src="P6.jpg"></div>
  <div class="mySlides fade"><img src="P7_1.jpg"></div>
  <div class="mySlides fade"><img src="P8.jpg"></div>
  <div class="mySlides fade"><img src="P9.jpg"></div>
  <div class="mySlides fade"><img src="P10.jpg"></div>
  <div class="mySlides fade"><img src="P13.jpg"></div>
  <div class="mySlides fade"><img src="P14.jpg"></div>
</div>

<button class="surprise-btn" onclick="showNextQuote()">Click Me 💌</button>
<div class="hidden-message" id="hiddenMessage"></div>

<!-- --------------------------------------------------------- -->
<!-- 🌟 NEW: Wedding Day Animation -->
<!-- --------------------------------------------------------- -->
<div id="weddingOverlay">
  <div class="big-text">Priya… Today our forever begins ❤️</div>
</div>

<!-- --------------------------------------------------------- -->
<!-- 💌 LOVE LETTER POPUP -->
<!-- --------------------------------------------------------- -->
<div id="loveLetter">
  <div id="typedText"></div>
  <button id="storyStartBtn" onclick="startStory()">Read Our Story ➜</button>
</div>

<!-- --------------------------------------------------------- -->
<!-- 📖 STORY OVERLAY -->
<!-- --------------------------------------------------------- -->
<div id="storyOverlay">
  <img id="storyImg" src="">
  <div id="storyCaption"></div>
</div>

<script>
/* FORCE COUNTDOWN TO 0 IMMEDIATELY (for preview) */
document.getElementById("countdown").innerHTML = "💖 It's Wedding Day! 💖";
setTimeout(startWeddingAnimation, 1000);

/* --------------------------------------------------------- */
/* 1️⃣ WEDDING DAY ANIMATION */
/* --------------------------------------------------------- */
function startWeddingAnimation() {
  const overlay = document.getElementById("weddingOverlay");
  overlay.style.display = "flex";

  for (let i = 0; i < 15; i++) {
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = Math.random()*100+"%";
    h.style.top = "60%";
    h.style.animationDuration = (3 + Math.random()*3) + "s";
    overlay.appendChild(h);
  }

  setTimeout(showLoveLetter, 3500);
}

/* --------------------------------------------------------- */
/* 2️⃣ LOVE LETTER (typing effect) */
/* --------------------------------------------------------- */
function showLoveLetter() {
  document.getElementById("weddingOverlay").style.display = "none";

  const letter = document.getElementById("loveLetter");
  letter.style.display = "block";

  const text = `
My love Priya,

We met on Jeevansathi… and from that first message,
something magical started.

From talking endlessly… to the day our families met…  
we secretly spent the entire day together — movies, food,
holding hands, your head on my shoulder…

Then Delhi… Lucknow… Mussoorie…
our first kiss… our first trip…
our first “I love you”.

And now, in just 3 days…  
we are becoming one.

Forever yours,  
Shubham ❤️
  `;

  let i = 0;
  const speed = 30;
  function type() {
    if (i < text.length) {
      document.getElementById("typedText").innerHTML += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

/* --------------------------------------------------------- */
/* 3️⃣ STORY SLIDESHOW */
/* --------------------------------------------------------- */
const storyImages = [
  "P6.jpg",
  "P7_1.jpg",
  "P8.jpg",
  "P9.jpg",
  "P10.jpg",
  "P13.jpg"
];

const storyTexts = [
  "17 March — She accepted the request on Jeevansathi… destiny’s first step.",
  "20 March — Our first WhatsApp message at 10:44 AM.",
  "Next day after family meeting — we spent the entire day together… movies, food, hands held tightly.",
  "31 May — Her birthday surprise… and our first kiss.",
  "Delhi trip — proposal in the room, shopping, romance, memories forever.",
  "Mussoorie — laughs, tears, drinks, dancing, and that kiss while riding scooty."
];

let storyIndex = 0;

function startStory() {
  document.getElementById("loveLetter").style.display = "none";
  document.getElementById("storyOverlay").style.display = "block";
  showStorySlide();
}

function showStorySlide() {
  if (storyIndex >= storyImages.length) {
    document.getElementById("storyCaption").innerHTML = "<br><br>❤️ I love you Priya… forever yours. ❤️";
    return;
  }

  document.getElementById("storyImg").src = storyImages[storyIndex];
  document.getElementById("storyCaption").innerHTML = storyTexts[storyIndex];

  storyIndex++;
  setTimeout(showStorySlide, 3000);
}

/* --------------------------------------------------------- */
/* Existing slideshow + quotes + hearts */
/* --------------------------------------------------------- */

let slideIndex = 0;
showSlides();
function showSlides() {
  let slides = document.getElementsByClassName("mySlides");
  for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
  slideIndex++;
  if (slideIndex > slides.length) slideIndex = 1;
  slides[slideIndex-1].style.display = "block";
  setTimeout(showSlides, 3500);
}

const quotes = [
  "Priya ❤️ You’re the most beautiful part of my life.\nI can’t wait to call you my forever. 💍",
  "Every moment with you feels like a fairytale come true. ✨",
  "You are my today and all of my tomorrows. ❤️",
  "I found my home in your arms, my love. 🏡💕",
  "Together is my favorite place to be. 💑",
  "Forever isn’t long enough with you, Priya. ♾️💖"
];

let quoteIndex = 0;
const msgEl = document.getElementById("hiddenMessage");

function showNextQuote() {
  msgEl.style.display = "block";
  msgEl.classList.remove("show");
  void msgEl.offsetWidth;
  msgEl.innerText = quotes[quoteIndex];
  msgEl.classList.add("show");
  quoteIndex = (quoteIndex + 1) % quotes.length;
}

document.addEventListener("click", function(e) {
  let heart = document.createElement("div");
  heart.className = "touch-heart";
  heart.innerText = "❤️";
  heart.style.left = e.pageX + "px";
  heart.style.top = e.pageY + "px";
  heart.style.fontSize = (12 + Math.random()*10) + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 1500);
});
</script>

</body>
</html>
